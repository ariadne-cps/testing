name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      checks: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 x86 GCC 12", os: ubuntu-24.04, cxx: "g++-12", pkg: "g++-12" }
          - { name: "Ubuntu 24.04 arm GCC 12", os: ubuntu-24.04-arm, cxx: "g++-12", pkg: "g++-12" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Get Linux concurrency
        if: runner.os == 'Linux'
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ${{ matrix.config.pkg }}

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target ariadne-testing

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install "${{ runner.workspace }}/build" --prefix "${{ runner.workspace }}/install"

      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target tests

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -j "$NPROC" --output-on-failure --output-junit "${{ github.workspace }}/ctest-junit.xml"

      - name: Upload CTest JUnit results
        if: ${{ !cancelled() && matrix.build_type == 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}
          path: ctest-junit.xml
          if-no-files-found: warn

      - name: Publish CTest results to GitHub Checks
        if: ${{ !cancelled() && github.event_name == 'push' && matrix.build_type == 'Debug' }}
        uses: dorny/test-reporter@v3
        with:
          name: CTest ${{ matrix.config.name }} [Debug]
          path: ctest-junit.xml
          reporter: java-junit
          list-tests: failed
          # CTest is the failure gate; publishing a valid failing report is not
          # a reporting error. Missing XML remains an error.
          fail-on-error: 'false'
          fail-on-empty: 'true'
