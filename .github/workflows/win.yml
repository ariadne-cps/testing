name: Windows

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # Allow Windows runners up to 60s to initialize the local cache server.
  SCCACHE_CONF: ${{ github.workspace }}/ss/bui/cmake/sccache.toml

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      checks: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Windows 2025 x86 MSVC", os: windows-2025, arch: x64 }
          - { name: "Windows 11 arm MSVC", os: windows-11-arm, arch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - name: Initialize Build submodule
        run: git submodule update --init -- ss/bui

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        # Cache setup must not block a valid compilation.
        continue-on-error: true
        with:
          version: "v0.18.0"

      - name: Initialize optional sccache before compilation
        run: cmake -P ss/bui/cmake/InitializeSccache.cmake

      - name: Configure CMake
        run: |
          # /Z7 embeds Debug symbols in .obj files, avoiding parallel MSVC compiler PDB writes.
          # Keep /Ob0, /Od and /RTC1 from CMake's standard Debug flags.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER="$env:SCCACHE_LAUNCHER" `
            -DCMAKE_CXX_COMPILER_LAUNCHER="$env:SCCACHE_LAUNCHER" `
            -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" `
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build build --parallel --target ariadne-testing

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install build --prefix "${{ runner.workspace }}/install"

      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: cmake --build build --parallel --target tests

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build --output-on-failure --output-junit "${{ github.workspace }}/ctest-junit.xml"

      - name: Upload CTest JUnit results
        if: ${{ !cancelled() && matrix.build_type == 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}
          path: ctest-junit.xml
          if-no-files-found: warn

      - name: Publish CTest results to GitHub Checks
        if: ${{ !cancelled() && github.event_name == 'push' && matrix.build_type == 'Debug' }}
        uses: dorny/test-reporter@v3
        with:
          name: CTest ${{ matrix.config.name }} [Debug]
          path: ctest-junit.xml
          reporter: java-junit
          # Explicitly expose passed cases as well as failures in Actions Summary.
          use-actions-summary: 'true'
          report-title: 'CTest JUnit results'
          list-suites: all
          list-tests: all
          collapsed: never
          # CTest is the failure gate; publishing a valid failing report is not
          # a reporting error. Missing XML remains an error.
          fail-on-error: 'false'
          fail-on-empty: 'true'
