name: Sanitizers

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CONF: ${{ github.workspace }}/.github/sccache.toml

jobs:
  thread-sanitizer:
    name: Ubuntu 24.04 x86 Clang 16 [ThreadSanitizer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        # Cache setup must not block a valid compilation.
        continue-on-error: true
        with:
          version: "v0.18.0"

      - name: Set up dependencies
        run: sudo apt-get install -y cmake ninja-build pkg-config clang-16

      - name: Initialize optional sccache before compilation
        run: cmake -P cmake/InitializeSccache.cmake

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build-tsan" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-16 \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DTHREAD_SANITIZER=ON \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build "${{ runner.workspace }}/build-tsan" --parallel 2 --target tests

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "${{ runner.workspace }}/build-tsan" --output-on-failure --output-junit "${{ github.workspace }}/ctest-junit.xml"
      - name: Upload CTest JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}
          path: ctest-junit.xml
          if-no-files-found: warn

      - name: Publish CTest results to GitHub Checks
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: dorny/test-reporter@v3
        with:
          name: CTest ThreadSanitizer
          path: ctest-junit.xml
          reporter: java-junit
          # Explicitly expose passed cases as well as failures in Actions Summary.
          use-actions-summary: 'true'
          report-title: 'CTest JUnit results'
          list-suites: all
          list-tests: all
          collapsed: never
          # CTest is the failure gate; publishing a valid failing report is not
          # a reporting error. Missing XML remains an error.
          fail-on-error: 'false'
          fail-on-empty: 'true'


  address-undefined-sanitizer:
    name: Ubuntu 24.04 x86 Clang 16 [AddressSanitizer + UBSan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        # Cache setup must not block a valid compilation.
        continue-on-error: true
        with:
          version: "v0.18.0"

      - name: Set up dependencies
        run: sudo apt-get install -y cmake ninja-build pkg-config clang-16

      - name: Initialize optional sccache before compilation
        run: cmake -P cmake/InitializeSccache.cmake

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build-asan" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-16 \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build "${{ runner.workspace }}/build-asan" --parallel 2 --target tests

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir "${{ runner.workspace }}/build-asan" --output-on-failure --output-junit "${{ github.workspace }}/ctest-junit.xml"
      - name: Upload CTest JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}
          path: ctest-junit.xml
          if-no-files-found: warn

      - name: Publish CTest results to GitHub Checks
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: dorny/test-reporter@v3
        with:
          name: CTest AddressSanitizer UBSan
          path: ctest-junit.xml
          reporter: java-junit
          # Explicitly expose passed cases as well as failures in Actions Summary.
          use-actions-summary: 'true'
          report-title: 'CTest JUnit results'
          list-suites: all
          list-tests: all
          collapsed: never
          # CTest is the failure gate; publishing a valid failing report is not
          # a reporting error. Missing XML remains an error.
          fail-on-error: 'false'
          fail-on-empty: 'true'

