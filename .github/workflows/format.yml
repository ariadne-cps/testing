name: Format

on:
  push:
    branches:
      - main
      - check-format
  pull_request:

permissions:
  contents: read

jobs:
  check-format:
    name: Clang Format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-16 clang-format-18

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-16 \
            -DWARNINGS_AS_ERRORS=ON

      - name: Check C++ formatting
        run: cmake --build "${{ runner.workspace }}/build" --target check-format
