name: macOS

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      checks: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "macOS 26 arm AppleClang 21", os: macos-26, cxx: "/usr/bin/clang++" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Get macOS concurrency
        if: runner.os == 'macOS'
        run: echo "NPROC=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      - name: Set up macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target ariadne-testing

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install "${{ runner.workspace }}/build" --prefix "${{ runner.workspace }}/install"

      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target tests

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -j "$NPROC" --output-on-failure --output-junit "${{ github.workspace }}/ctest-junit.xml"

      - name: Upload CTest JUnit results
        if: ${{ !cancelled() && matrix.build_type == 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}-${{ strategy.job-index }}
          path: ctest-junit.xml
          if-no-files-found: warn

      - name: Publish CTest results to GitHub Checks
        if: ${{ !cancelled() && github.event_name == 'push' && matrix.build_type == 'Debug' }}
        uses: dorny/test-reporter@v3
        with:
          name: CTest ${{ matrix.config.name }} [Debug]
          path: ctest-junit.xml
          reporter: java-junit
          # Explicitly expose passed cases as well as failures in Actions Summary.
          use-actions-summary: 'true'
          report-title: 'CTest JUnit results'
          list-suites: all
          list-tests: all
          collapsed: never
          # CTest is the failure gate; publishing a valid failing report is not
          # a reporting error. Missing XML remains an error.
          fail-on-error: 'false'
          fail-on-empty: 'true'
